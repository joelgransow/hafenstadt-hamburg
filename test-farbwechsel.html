<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testseite: Farbwechsel</title>
<style>
  :root {
    --flaeche: #0B4F9E;
    --schrift: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    background: var(--flaeche);
    color: var(--schrift);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 18px;
    transition: background-color 320ms ease, color 320ms ease;
  }

  .buehne {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: 1.5rem;
    text-align: center;
  }

  .farbname {
    margin: 0;
    font-size: clamp(1.75rem, 7vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  .hexwert {
    margin: 0;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 1rem;
    letter-spacing: 0.08em;
    opacity: 0.75;
  }

  .schalter {
    font: inherit;
    font-weight: 700;
    font-size: 1.125rem;
    color: inherit;
    background: transparent;
    border: 3px solid currentColor;
    border-radius: 999px;
    padding: 0.75rem 1.75rem;
    min-height: 3rem;
    cursor: pointer;
    transition: transform 120ms ease, opacity 120ms ease;
  }

  .schalter:hover { opacity: 0.8; }
  .schalter:active { transform: scale(0.97); }

  .schalter:focus-visible {
    outline: 3px solid currentColor;
    outline-offset: 4px;
  }

  .anzeige {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.25rem 1.5rem;
    padding: 0.75rem 1rem;
    border-top: 1px solid currentColor;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 0.8125rem;
    letter-spacing: 0.04em;
    opacity: 0.8;
  }

  .vorlesen {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }

  @media (prefers-reduced-motion: reduce) {
    body, .schalter { transition: none; }
  }
</style>
</head>
<body>

  <main class="buehne">
    <p class="hexwert" id="hexwert">#0B4F9E</p>
    <h1 class="farbname" id="farbname">Signalblau</h1>
    <button type="button" class="schalter" id="schalter">Farbe wechseln</button>
  </main>

  <p class="vorlesen" role="status" aria-live="polite" id="meldung"></p>

  <div class="anzeige">
    <span>eingebettet: <b id="rahmen">–</b></span>
    <span>breite: <b id="breite">–</b></span>
    <span>klicks: <b id="klicks">0</b></span>
  </div>

<script>
(function () {
  var farben = [
    { name: "Signalblau",   hex: "#0B4F9E", schrift: "#ffffff" },
    { name: "Signalrot",    hex: "#C8102E", schrift: "#ffffff" },
    { name: "Signalgelb",   hex: "#F2C500", schrift: "#101418" },
    { name: "Lotsengrün",   hex: "#007A5E", schrift: "#ffffff" },
    { name: "Nebelweiß",    hex: "#EDEFF2", schrift: "#101418" },
    { name: "Nachtschwarz", hex: "#101418", schrift: "#ffffff" }
  ];

  var stand = 0;
  var klicks = 0;

  var wurzel   = document.documentElement;
  var elName   = document.getElementById("farbname");
  var elHex    = document.getElementById("hexwert");
  var elKlicks = document.getElementById("klicks");
  var elMeldung = document.getElementById("meldung");
  var elBreite = document.getElementById("breite");
  var elRahmen = document.getElementById("rahmen");

  document.getElementById("schalter").addEventListener("click", function () {
    stand = (stand + 1) % farben.length;
    klicks = klicks + 1;

    var farbe = farben[stand];
    wurzel.style.setProperty("--flaeche", farbe.hex);
    wurzel.style.setProperty("--schrift", farbe.schrift);

    elName.textContent = farbe.name;
    elHex.textContent = farbe.hex;
    elKlicks.textContent = klicks;
    elMeldung.textContent = "Farbe " + farbe.name + ", " + farbe.hex;
  });

  function breiteZeigen() {
    elBreite.textContent = Math.round(window.innerWidth) + " px";
  }

  breiteZeigen();
  window.addEventListener("resize", breiteZeigen);

  try {
    elRahmen.textContent = (window.self !== window.top) ? "ja" : "nein";
  } catch (e) {
    elRahmen.textContent = "ja";
  }
})();
</script>

</body>
</html>
